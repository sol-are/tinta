# Layout detection config for selfhosted mode.
# Based on the official GLM-OCR config:
# https://github.com/zai-org/GLM-OCR/blob/main/glmocr/config.yaml
#
# Only layout-related settings are included here.
# Mode, OCR API URL, and model are set via CLI arguments / env vars.

pipeline:
  enable_layout: true
  max_workers: 32
  page_maxsize: 100
  region_maxsize: 800

  result_formatter:
    label_visualization_mapping:
      table:
        - table
      formula:
        - display_formula
        - inline_formula
      image:
        - chart
        - image
      text:
        - abstract
        - algorithm
        - content
        - doc_title
        - figure_title
        - paragraph_title
        - reference_content
        - text
        - vertical_text
        - vision_footnote
        - seal
        - formula_number

  layout:
    model_dir: PaddlePaddle/PP-DocLayoutV3_safetensors
    threshold: 0.3
    batch_size: 1
    workers: 1
    cuda_visible_devices: "0"
    layout_nms: true
    layout_unclip_ratio:
      - 1.0
      - 1.0
    layout_merge_bboxes_mode:
      0: large   # abstract
      1: large   # algorithm
      2: large   # aside_text
      3: large   # chart
      4: large   # content
      5: large   # display_formula
      6: large   # doc_title
      7: large   # figure_title
      8: large   # footer
      9: large   # footer_image
      10: large  # footnote
      11: large  # formula_number
      12: large  # header
      13: large  # header_image
      14: large  # image
      15: large  # inline_formula
      16: large  # number
      17: large  # paragraph_title
      18: small  # reference
      19: large  # reference_content
      20: large  # seal
      21: large  # table
      22: large  # text
      23: large  # vertical_text
      24: large  # vision_footnote

    label_task_mapping:
      text:
        - abstract
        - algorithm
        - content
        - doc_title
        - figure_title
        - paragraph_title
        - reference_content
        - text
        - vertical_text
        - vision_footnote
        - seal
        - formula_number
      table:
        - table
      formula:
        - display_formula
        - inline_formula
      skip:
        - chart
        - image
      abandon:
        - header
        - footer
        - number
        - footnote
        - aside_text
        - reference
        - footer_image
        - header_image

    id2label:
      0: abstract
      1: algorithm
      2: aside_text
      3: chart
      4: content
      5: display_formula
      6: doc_title
      7: figure_title
      8: footer
      9: footer_image
      10: footnote
      11: formula_number
      12: header
      13: header_image
      14: image
      15: inline_formula
      16: number
      17: paragraph_title
      18: reference
      19: reference_content
      20: seal
      21: table
      22: text
      23: vertical_text
      24: vision_footnote
